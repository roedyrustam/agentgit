[package]
name = "agentgit"
version = "0.1.0"
edition = "2021"
description = "Local-first Causal Time-Travel & Shadow Worktree Engine (CLI + MCP v1.x + Sidecar UI) for Multi-Agent AI"
license = "MIT"
readme = "README.md"
keywords = ["git", "mcp", "ai", "agents", "worktree"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "agentgit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tiny_http = "0.12"
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
tempfile = "3.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
